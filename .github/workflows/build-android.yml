name: Build Flutter APK

on:
  push:
    branches: [ main, master ] # با پوش کردن به این برنچ‌ها اجرا میشه
  workflow_dispatch: # این خط بهت اجازه میده دستی با یک دکمه بیلد بگیری

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # یا نسخه مشخصی که پروژت نیاز داره (مثلا 3.24.0)
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # در صورت نیاز به تولید فایل‌های build_runner (اگر پروژت نیاز داره کامنت رو بردار):
      # - name: Run build_runner
      #   run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
